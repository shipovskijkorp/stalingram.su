{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{% if request.user.is_authenticated and request.user.theme == 'dark' %}#171412{% else %}#801f28{% endif %}">
  <title>{% block title %}Stalingram{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  <link rel="stylesheet" href="{% static 'css/profile.css' %}">
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}"{% if request.user.is_authenticated %} data-theme="{{ request.user.theme }}" data-enter-to-send="{{ request.user.enter_to_send|yesno:'true,false' }}"{% endif %}>
  {% if messages %}
    <div class="flash-stack" aria-live="polite">
      {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'js/profile.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
